name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://theresewhite.bahtzang.com
      NEXT_PUBLIC_CLARITY_ID: xxajqpw2g7
      NEXT_PUBLIC_GA_ID: G-4QVRMZJVWS
      # Web3Forms access key. Public by design (it ships in the HTML), but
      # kept as a repo variable so it can be rotated without a code change.
      # Until it is set, the contact page shows phone and email instead of a
      # form that goes nowhere.
      NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Nothing in the toolchain checks this, and getting it wrong is silent:
      # with the source on "Deploy from a branch", the last good artifact keeps
      # serving, so the site looks fine until the next push republishes the
      # repo source as a Jekyll site. Fail loudly instead.
      # See docs/solutions/deployment-issues/nextjs-static-export-github-pages-source-and-subpath.md
      - name: Assert Pages is on the GitHub Actions source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type')
          echo "Pages build_type: $build_type"
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Pages source is '$build_type', expected 'workflow'. Settings → Pages → Source must be 'GitHub Actions', not 'Deploy from a branch'."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tests and the build both pass straight through type errors, so
      # without this step the only thing that checks types is a person
      # remembering to. It runs first because it is the fastest (about three
      # seconds) and fails the deploy before anything slower starts.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Every page's link-preview card, checked in the built HTML rather than
      # the source. The source looked correct at three separate points while
      # the output was wrong — that is the whole lesson of the 2026-08-11
      # failure, which shipped for a week with every page returning 200.
      # See docs/solutions/deployment-issues/link-previews-open-graph-inheritance-and-image-content-type.md
      - name: Assert every page ships its own link-preview card
        run: npm run verify:build

      # A 200 on / proves nothing here: the HTML is always fine, it's the
      # root-absolute /_next/* paths that break when the served root isn't the
      # site root. Check the built output instead of trusting the exit code.
      - name: Assert assets are addressed from the site root
        run: |
          if ! grep -q '"/_next/' out/index.html; then
            echo "::error::out/index.html has no root-absolute /_next/ asset paths — did basePath change?"
            exit 1
          fi
          test -f out/CNAME && echo "CNAME present (safety net for branch-deploy only)"

      # Since v4 this action leaves out files whose names start with a dot,
      # so out/.nojekyll no longer ships. That is harmless: the first step
      # guarantees Pages publishes this artifact as-is and never runs Jekyll.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  # calculator.theresewhite.com. theresewhite.com is still on Wix, so the
  # calculator is published on its own subdomain from a second repository,
  # thirstypig/theresewhite-calculator, which GitHub Pages serves from its
  # gh-pages branch. This builds the site again with that address, keeps only
  # the calculator page, and replaces the branch with it.
  #
  # Runs after `build` so a failing type check or test stops this too.
  # Retire it at cutover, when /conflict-calculator on the main site takes
  # over; the subdomain should then redirect there rather than go dark.
  calculator-site:
    needs: build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://calculator.theresewhite.com
      NEXT_PUBLIC_CLARITY_ID: xxajqpw2g7
      NEXT_PUBLIC_GA_ID: G-4QVRMZJVWS
      # The review password screen and feedback panel (DEPLOY.md, "Reviewer
      # feedback"). Only a hash of the password; leave it unset to publish
      # the page open to everyone.
      REVIEW_PASSPHRASE_HASH: ${{ vars.REVIEW_PASSPHRASE_HASH }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node scripts/build-calculator-site.mjs out calculator-site

      # The same link-preview audit as the main site, on the one page this
      # site has, so a shared link to the calculator shows a proper card.
      - name: Assert the calculator ships its own link-preview card
        run: node scripts/verify-built-output.mjs calculator-site

      # A deploy key that can write to that one repository and nothing else.
      # The private half is this repository's CALCULATOR_DEPLOY_KEY secret.
      - name: Publish to thirstypig/theresewhite-calculator
        env:
          DEPLOY_KEY: ${{ secrets.CALCULATOR_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::The CALCULATOR_DEPLOY_KEY secret is not set, so calculator.theresewhite.com was not updated. DEPLOY.md explains how to set it."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/calculator_key
          chmod 600 ~/.ssh/calculator_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/calculator_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          cd calculator-site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${{ github.sha }} from ${{ github.repository }}"
          # Replaces the branch outright: it holds build output only, and
          # its history would be nothing but old copies of the same page.
          git push -q --force git@github.com:thirstypig/theresewhite-calculator.git gh-pages

  # book.theresewhite.com, the free-guide signup page for LinkedIn posts.
  # Published exactly like the calculator above, from a third repository,
  # thirstypig/theresewhite-book, with the PDF beside the page. Signups go to
  # Therese's Kit account; the form's number is the NEXT_PUBLIC_KIT_FORM_ID
  # repository variable (public by design: Kit's form address needs no key).
  #
  # Until the BOOK_DEPLOY_KEY secret exists this job skips the publish step
  # with a warning rather than failing, so the one-time setup in DEPLOY.md
  # can happen after this merges without turning every deploy red.
  book-site:
    needs: build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://book.theresewhite.com
      NEXT_PUBLIC_CLARITY_ID: xxajqpw2g7
      NEXT_PUBLIC_GA_ID: G-4QVRMZJVWS
      NEXT_PUBLIC_KIT_FORM_ID: ${{ vars.NEXT_PUBLIC_KIT_FORM_ID }}
      NEXT_PUBLIC_KIT_SENDS_COPY: ${{ vars.NEXT_PUBLIC_KIT_SENDS_COPY }}
      # The review password screen and feedback panel, as above.
      REVIEW_PASSPHRASE_HASH: ${{ vars.REVIEW_PASSPHRASE_HASH }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node scripts/build-calculator-site.mjs out book-site book

      # LinkedIn reads these tags to draw the post's card, so a broken card
      # is a broken post.
      - name: Assert the book page ships its own link-preview card
        run: node scripts/verify-built-output.mjs book-site

      # Without the form number the page still works but sends nobody to Kit.
      - name: Warn if signups are not connected to Kit
        if: ${{ vars.NEXT_PUBLIC_KIT_FORM_ID == '' }}
        run: echo "::warning::NEXT_PUBLIC_KIT_FORM_ID is not set, so book.theresewhite.com gives the guide away without recording anyone in Kit."

      - name: Publish to thirstypig/theresewhite-book
        env:
          DEPLOY_KEY: ${{ secrets.BOOK_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::The BOOK_DEPLOY_KEY secret is not set, so book.theresewhite.com was not updated. DEPLOY.md explains the one-time setup."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/book_key
          chmod 600 ~/.ssh/book_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/book_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          cd book-site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${{ github.sha }} from ${{ github.repository }}"
          git push -q --force git@github.com:thirstypig/theresewhite-book.git gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # The other half of the same failure, and the half no pre-deploy check
      # can see: Next emits out/opengraph-image with no extension, GitHub
      # Pages types files by extension, and an extensionless PNG is served as
      # application/octet-stream. Valid bytes, 200 response, and LinkedIn,
      # Facebook and iMessage all drop the image because they dispatch on the
      # header. The build copies it to og.png, which fixes it; this proves the
      # fix is still true on the wire.
      #
      # This cannot block the deploy — the artifact is live by the time it
      # runs. It is an alarm, and it covers the one thing our code does not
      # control: GitHub's typing behaviour, which the post-mortem records as
      # observed rather than documented.
      - name: Assert the link-preview image is served as an image
        run: |
          url="${{ steps.deployment.outputs.page_url }}og.png?ci=${{ github.run_id }}"
          for attempt in 1 2 3 4 5; do
            ct=$(curl -sI --max-time 10 "$url" | tr -d '\r' \
                 | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}')
            case "$ct" in
              image/png*) echo "og.png served as $ct"; exit 0 ;;
            esac
            echo "attempt $attempt: content-type was '${ct:-<none>}'"
            # Not after the final attempt: there is nothing left to wait for,
            # and it only delays the error report below by 10s.
            if [ "$attempt" -lt 5 ]; then sleep 10; fi
          done
          echo "::error::og.png is served as '${ct:-<none>}', not image/png. Link previews will drop the image on LinkedIn, Facebook and iMessage. See docs/solutions/deployment-issues/link-previews-open-graph-inheritance-and-image-content-type.md"
          exit 1
